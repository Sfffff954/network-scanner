<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <g>
    <title>ESP32 to OLED SSD1306 I2C Wiring Diagram</title>
    <rect x="50" y="50" width="700" height="500" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="400" y="100" text-anchor="middle" font-size="24" font-weight="bold">ESP32 to OLED SSD1306 I2C Wiring</text>
    <circle cx="200" cy="300" r="40" fill="#00ff00" stroke="#000" stroke-width="2"/>
    <text x="200" y="300" text-anchor="middle" dy=".35em" font-size="16">ESP32</text>
    <circle cx="600" cy="300" r="40" fill="#0000ff" stroke="#000" stroke-width="2"/>
    <text x="600" y="300" text-anchor="middle" dy=".35em" font-size="16">SSD1306</text>
    <line x1="200" y1="300" x2="600" y2="300" stroke="#000" stroke-width="2"/>
    <text x="400" y="320" text-anchor="middle" font-size="14">I2C Connections</text>
    <text x="200" y="370" text-anchor="middle" font-size="12">SDA</text>
    <text x="600" y="370" text-anchor="middle" font-size="12">SDA</text>
    <text x="200" y="400" text-anchor="middle" font-size="12">SCL</text>
    <text x="600" y="400" text-anchor="middle" font-size="12">SCL</text>
  </g>
</svg>